<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>একটি অকথিত স্বীকারোক্তি ও ক্ষমা প্রার্থনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Great+Vibes&family=Noto+Serif+Bengali:ital,wght@0,400;0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">

<style>
  :root {
    --gold-bright: #fff3be;
    --gold-main: #f5cf6d;
    --gold-deep: #b38328;
    --gold-foil: linear-gradient(135deg, #fff3be 0%, #e5b349 45%, #9c6c18 80%, #523707 100%);
    --candle-flame: #ffb834;
    --parchment-bg: #fcf8ee;
    --ink-royal: #340c16;
    --mouse-x: 50vw;
    --mouse-y: 40vh;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
    touch-action: manipulation;
  }
  
  html, body { 
    height: 100%;
    width: 100%; 
    overflow: hidden; 
  }

  body {
    font-family: 'Noto Serif Bengali', serif;
    background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #350612 0%, #170207 55%, #070003 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1400px;
    position: relative;
    user-select: none;
    transition: background 0.8s ease;
  }

  body.candle-dark {
    background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #1f030a 0%, #0d0104 55%, #020001 100%);
  }

  canvas#stardustCanvas {
    position: fixed; 
    inset: 0; 
    pointer-events: none; 
    z-index: 1;
  }

  /* Royal Header (Max 600px Width) */
  .royal-header {
    position: fixed;
    top: 14px;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 600px; /* 600dp */
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }
  .royal-header > * { pointer-events: auto; }

  /* Candle */
  .candle-assembly {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 6px;
  }
  .flame-halo {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 185, 60, 0.35) 0%, rgba(255, 140, 30, 0.12) 42%, transparent 70%);
    pointer-events: none;
    animation: haloBreathe 2.4s infinite alternate ease-in-out;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  @keyframes haloBreathe {
    0% { transform: translateX(-50%) scale(0.92); opacity: 0.75; }
    100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
  }
  .candle-flame-core {
    position: relative;
    width: 13px;
    height: 25px;
    background: radial-gradient(ellipse at 50% 85%, #ffffff 0%, #fff2a8 22%, var(--candle-flame) 58%, #df4212 95%);
    border-radius: 50% 50% 25% 25% / 60% 60% 30% 30%;
    box-shadow: 0 0 14px rgba(255, 175, 50, 0.85), 0 0 28px rgba(255, 140, 30, 0.4);
    transform-origin: bottom center;
    animation: flameDancing 0.14s infinite alternate ease-in-out;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    z-index: 2;
  }
  .candle-flame-core::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 6px;
    background: radial-gradient(circle, #3d8aff 0%, rgba(30, 80, 220, 0.8) 60%, transparent 100%);
    border-radius: 50%;
  }
  @keyframes flameDancing {
    0% { transform: scaleY(1) scaleX(0.96) rotate(-1.5deg); }
    100% { transform: scaleY(1.09) scaleX(1.02) rotate(2deg); }
  }
  .candle-wick {
    width: 2px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 1px;
    margin-top: -1px;
    margin-bottom: -1px;
    z-index: 1;
  }
  .candle-pillar {
    position: relative;
    width: 15px;
    height: 36px;
    background: linear-gradient(90deg, #dfd3bd 0%, #fffdf8 35%, #f2ebd9 70%, #baa88d 100%);
    border-radius: 2px 2px 4px 4px;
    box-shadow: inset 0 -2px 5px rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.5);
    z-index: 1;
  }
  .wax-tear {
    position: absolute;
    top: 0;
    left: 1px;
    width: 4px;
    height: 12px;
    background: #fffefb;
    border-radius: 0 0 4px 4px;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  .candle-tray {
    width: 28px;
    height: 5px;
    background: var(--gold-foil);
    border-radius: 999px;
    margin-top: -2px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.6);
    z-index: 1;
  }
  .candle-assembly.extinguished .candle-flame-core {
    transform: scale(0);
    opacity: 0;
  }
  .candle-assembly.extinguished .flame-halo {
    opacity: 0;
    transform: translateX(-50%) scale(0.3);
  }
  .candle-smoke {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: rgba(220, 220, 220, 0.6);
    border-radius: 50%;
    filter: blur(1.5px);
    opacity: 0;
    pointer-events: none;
  }
  .candle-assembly.extinguished .candle-smoke {
    animation: smokePuff 1.2s ease-out forwards;
  }
  @keyframes smokePuff {
    0% { opacity: 0.8; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-120%) translateY(-28px) scale(3.5); }
  }

  /* Minimal Sound Icon Button */
  .hud-actions {
    display: flex;
    align-items: center;
  }
  .hud-btn.music-btn {
    background: rgba(35, 4, 11, 0.75);
    border: 1.5px solid rgba(245, 207, 109, 0.5);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    color: var(--gold-bright);
    backdrop-filter: blur(12px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    transition: all 0.25s ease;
  }
  .hud-btn.music-btn:hover {
    border-color: var(--gold-bright);
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(245, 207, 109, 0.45);
  }

  /* Stage Container: 1200px (600dp) width */
  .stage {
    position: relative;
    width: 95%;
    max-width: 600px; /* 600dp */
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
    z-index: 10;
  }

  /* State 1: Envelope */
  .envelope-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .crest-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .crest-ring {
    width: 44px;
    height: 44px;
    margin: 0 auto 8px;
    border: 1.8px solid var(--gold-main);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-bright);
    font-size: 19px;
    box-shadow: 0 0 16px rgba(245, 207, 109, 0.45);
    animation: crestGleam 3.5s infinite alternate;
  }
  @keyframes crestGleam {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); filter: drop-shadow(0 0 12px var(--gold-bright)); }
  }
  .crest-title {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 11.5px;
    letter-spacing: 2.5px;
    color: var(--gold-bright);
    text-transform: uppercase;
  }
  .royal-envelope {
    position: relative;
    width: 100%;
    max-width: 350px;
    aspect-ratio: 340 / 225;
    border-radius: 14px;
    background: linear-gradient(150deg, #440715 0%, #29030c 60%, #160105 100%);
    box-shadow:
      0 35px 80px rgba(0,0,0,0.9),
      0 0 0 1.5px rgba(245, 207, 109, 0.4),
      inset 0 0 30px rgba(245, 207, 109, 0.18);
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .royal-envelope:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 40px 90px rgba(0,0,0,0.95), 0 0 35px rgba(245, 207, 109, 0.35);
  }
  .filigree-inner {
    position: absolute;
    inset: 10px;
    border: 1.2px solid rgba(245, 207, 109, 0.4);
    border-radius: 10px;
    pointer-events: none;
  }
  .velvet-sash {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 38px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, #180207 0%, #7d1229 25%, #a81c3a 50%, #7d1229 75%, #180207 100%);
    box-shadow: 0 4px 15px rgba(0,0,0,0.65);
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .velvet-sash::before, .velvet-sash::after {
    content: '';
    position: absolute; left: 0; right: 0; height: 1.5px;
    background: var(--gold-foil);
  }
  .velvet-sash::before { top: 2px; }
  .velvet-sash::after { bottom: 2px; }

  .envelope-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 58%;
    background: linear-gradient(175deg, #59091c 0%, #3a0410 70%, #200107 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 5;
    border-top: 1px solid rgba(255, 243, 190, 0.45);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .royal-envelope.unsealed .envelope-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .wax-medallion {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 68px; height: 68px;
    background: radial-gradient(circle at 35% 30%, #d82b4f 0%, #87142b 60%, #460513 100%);
    border-radius: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 10px 25px rgba(0,0,0,0.85),
      inset 0 -3px 5px rgba(0,0,0,0.7),
      inset 0 3px 5px rgba(255, 150, 180, 0.4);
    animation: medallionGlow 2.5s infinite alternate ease-in-out;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
  }
  @keyframes medallionGlow {
    0% { filter: drop-shadow(0 0 5px rgba(245, 207, 109, 0.3)); }
    100% { filter: drop-shadow(0 0 15px rgba(245, 207, 109, 0.7)); }
  }
  .wax-medallion::before {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px dashed rgba(245, 207, 109, 0.65);
  }
  .seal-crest {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 243, 190, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.18);
  }
  .seal-crest svg {
    width: 22px; height: 22px;
    fill: var(--gold-main);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
  }
  .royal-envelope.unsealed .wax-medallion {
    transform: translate(-50%, -50%) scale(0.2) rotate(45deg);
    opacity: 0;
    pointer-events: none;
  }

  /* State 2: Parchment Letter Desk */
  .letter-desk {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .letter-desk.active {
    display: flex;
    animation: deskReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes deskReveal {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(8px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* 600dp / 1200px Parchment Container */
  .imperial-parchment {
    position: relative;
    width: 100%;
    max-width: 600px; /* 600dp */
    height: clamp(480px, 80vh, 580px);
    background: var(--parchment-bg);
    border-radius: 12px;
    padding: 16px 20px 14px; /* প্যাডিং কমিয়ে হেডিং একদম উপরে সেট */
    color: var(--ink-royal);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.85),
      0 0 0 1px rgba(179, 131, 40, 0.35),
      inset 0 0 40px rgba(245, 207, 109, 0.2);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .imperial-parchment::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1.5px solid rgba(179, 131, 40, 0.45);
    border-radius: 8px;
    pointer-events: none;
  }
  .imperial-parchment::after {
    content: '';
    position: absolute; inset: 12px;
    border: 1px dashed rgba(179, 131, 40, 0.25);
    border-radius: 6px;
    pointer-events: none;
  }

  /* Salutation Text (একদম উপরে সেন্টারে সেট করা) */
  .letter-salutation {
    font-size: clamp(17px, 4.2vw, 20px);
    font-weight: 800;
    color: #630c1e;
    text-align: center;
    margin-top: 0;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(179, 131, 40, 0.3);
    padding-bottom: 6px;
    letter-spacing: 0.5px;
  }

  /* Internal Scrollable Writing Area */
  .writing-container {
    position: relative;
    width: 100%;
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
    margin-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(179, 131, 40, 0.4) transparent;
  }
  .writing-container::-webkit-scrollbar {
    width: 4px;
  }
  .writing-container::-webkit-scrollbar-thumb {
    background: rgba(179, 131, 40, 0.4);
    border-radius: 4px;
  }

  #goldFountainPen {
    position: absolute;
    width: 42px;
    height: 42px;
    pointer-events: none;
    z-index: 50;
    transform: translate(-6px, -36px) rotate(-18deg);
    transition: transform 0.08s ease-out;
    filter: drop-shadow(2px 5px 4px rgba(0,0,0,0.35));
    display: none;
  }
  .letter-body-area {
    font-size: clamp(13.5px, 3.8vw, 14.8px);
    line-height: 1.95;
    color: #3b111b;
    white-space: pre-wrap;
    display: inline;
  }
  .writing-blinker {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: var(--gold-deep);
    vertical-align: middle;
    margin-left: 2px;
    animation: blinkCursor 0.7s infinite;
  }
  @keyframes blinkCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* Bottom Sign Area with Corner Stamp */
  .letter-bottom-sign {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 8px;
    border-top: 1px solid rgba(179, 131, 40, 0.25);
    position: relative;
  }
  
  /* Corner Circle Stamp */
  .royal-watermark-stamp {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1.5px solid rgba(179, 131, 40, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(179, 131, 40, 0.85);
    font-size: 8.5px;
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    transform: rotate(-10deg);
    font-family: 'Cinzel Decorative', cursive;
    letter-spacing: 0.5px;
    margin-left: 4px;
    margin-bottom: 2px;
  }

  /* Updated Signature Area with 'Great Vibes' Calligraphy */
  .sign-area {
    text-align: right;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.7s ease;
  }
  .sign-area.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .sign-title { 
    font-size: 13px; 
    color: #73303d; 
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .sign-handwrite {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(30px, 7.5vw, 36px);
    color: #83122c;
    display: block;
    line-height: 1.1;
    letter-spacing: 1px;
    text-shadow: 1px 1px 1px rgba(179, 131, 40, 0.25);
  }
</style>
</head>
<body>

<canvas id="stardustCanvas"></canvas>

<!-- Top Royal Header -->
<header class="royal-header">
  <div class="candle-assembly" id="candleAssembly" title="মোমবাতিতে ক্লিক করে নেভাতে বা জ্বালাতে পারেন">
    <div class="flame-halo"></div>
    <div class="candle-flame-core"></div>
    <div class="candle-smoke"></div>
    <div class="candle-wick"></div>
    <div class="candle-pillar">
      <div class="wax-tear"></div>
    </div>
    <div class="candle-tray"></div>
  </div>

  <div class="hud-actions">
    <!-- শুধু আইকন সমৃদ্ধ গোল বাটন -->
    <button class="hud-btn music-btn" id="musicToggleBtn" title="মিউজিক অন / অফ">
      <span id="musicSymbol">🔊</span>
    </button>
  </div>
</header>

<div class="stage">
  <!-- State 1: Envelope -->
  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="crest-header">
      <div class="crest-ring">⚜</div>
      <div class="crest-title">Imperial Sealed Message</div>
    </div>

    <div class="royal-envelope" id="royalEnvelope" title="সিলমোহরটিতে স্পর্শ করুন">
      <div class="filigree-inner"></div>
      <div class="envelope-flap"></div>
      <div class="velvet-sash"></div>

      <div class="wax-medallion" id="sealMedallion">
        <div class="seal-crest">
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- State 2: Parchment Letter Desk (Fixed 600dp) -->
  <div class="letter-desk" id="letterDesk">
    <div class="imperial-parchment" id="parchmentContainer">
      <div class="letter-salutation" id="letterSalute">একসময়ের ভীষণ আপন মানুষটিকে,</div>
      
      <div class="writing-container" id="writingContainer">
        <svg id="goldFountainPen" viewBox="0 0 60 60" fill="none">
          <path d="M48 4L56 12L22 46L10 50L14 38L48 4Z" fill="url(#penGoldGrad)" stroke="#523707" stroke-width="1.5"/>
          <path d="M10 50L14 38L22 46L10 50Z" fill="#380713"/>
          <circle cx="17" cy="43" r="1.5" fill="#f5cf6d"/>
          <defs>
            <linearGradient id="penGoldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff3be"/>
              <stop offset="50%" stop-color="#e5b349"/>
              <stop offset="100%" stop-color="#805611"/>
            </linearGradient>
          </defs>
        </svg>

        <div class="letter-body-area" id="letterBodyText"></div><span class="writing-blinker" id="writingBlinker"></span>
      </div>

      <div class="letter-bottom-sign">
        <!-- বাম পাশের নিচের কোনায় স্ট্যাম্প -->
        <div class="royal-watermark-stamp">
          Dev<br>PaPi KiNg<br>Pro
        </div>
        
        <!-- ডান পাশের নতুন সিগনেচার স্টাইল ও টেক্সট -->
        <div class="sign-area" id="signArea">
          <span class="sign-title">নিঃশর্ত ক্ষমাপ্রার্থনায়—</span>
          <span class="sign-handwrite">PaPi KiNg</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // 1. Torch Light Tracking
  window.addEventListener('pointermove', function(e){
    document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
    document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');
  });

  // 2. Interactive Candle Click
  var candleAssembly = document.getElementById('candleAssembly');
  var isCandleLit = true;

  candleAssembly.addEventListener('click', function(){
    isCandleLit = !isCandleLit;
    if(!isCandleLit){
      candleAssembly.classList.add('extinguished');
      document.body.classList.add('candle-dark');
      candleAssembly.setAttribute('title', 'মোমবাতিটি জ্বালাতে আবার ক্লিক করুন');
    } else {
      candleAssembly.classList.remove('extinguished');
      document.body.classList.remove('candle-dark');
      candleAssembly.setAttribute('title', 'মোমবাতিতে ক্লিক করে নেভাতে পারেন');
    }
  });

  // 3. Web Audio API Synth Engine
  var audioCtx = null;
  var musicOn = true;
  var isMusicPlaying = false;
  var currentSequenceTimer = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function soundWaxCrack() {
    if (!musicOn) return;
    var ctx = initAudio();
    var bufferSize = ctx.sampleRate * 0.15;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 900;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
  }

  function playPianoKey(freq, time, duration) {
    var ctx = initAudio();
    var osc1 = ctx.createOscillator();
    var osc2 = ctx.createOscillator();
    var gain = ctx.createGain();

    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, time);
    osc2.frequency.setValueAtTime(freq * 1.002, time);

    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.09, time + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);

    osc1.start(time);
    osc2.start(time);
    osc1.stop(time + duration);
    osc2.stop(time + duration);
  }

  var pianoChords = [
    [523.25, 659.25, 783.99, 1046.50],
    [392.00, 493.88, 587.33, 783.99],
    [440.00, 523.25, 659.25, 880.00],
    [349.23, 440.00, 523.25, 698.46]
  ];
  var chordIndex = 0;

  function runMusicSequence() {
    if (!musicOn || !isMusicPlaying) return;
    var ctx = initAudio();
    var now = ctx.currentTime;
    var chord = pianoChords[chordIndex];

    chord.forEach(function(note, idx) {
      playPianoKey(note, now + idx * 0.3, 2.4);
    });

    chordIndex = (chordIndex + 1) % pianoChords.length;
    currentSequenceTimer = setTimeout(runMusicSequence, 2600);
  }

  function startMusic() {
    if (!hasUnsealed || isMusicPlaying || !musicOn) return;
    isMusicPlaying = true;
    runMusicSequence();
  }

  // আইকন-বেসড মিউজিক টগল লজিক (🔊 / 🔇)
  var musicToggleBtn = document.getElementById('musicToggleBtn');
  var musicSymbol = document.getElementById('musicSymbol');

  musicToggleBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    if (musicOn) {
      musicSymbol.textContent = '🔊';
      if (hasUnsealed) startMusic();
    } else {
      musicSymbol.textContent = '🔇';
      isMusicPlaying = false;
      if (currentSequenceTimer) clearTimeout(currentSequenceTimer);
    }
  });

  // 4. Stardust / Fireflies Canvas
  var canvas = document.getElementById('stardustCanvas');
  var ctx = canvas.getContext('2d');
  var cW, cH;
  var fireflies = [];
  var burstSparks = [];

  function handleResize(){
    cW = canvas.width = window.innerWidth;
    cH = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', handleResize);
  handleResize();

  for (var i = 0; i < 28; i++) {
    fireflies.push({
      x: Math.random() * cW,
      y: Math.random() * cH,
      size: Math.random() * 2.5 + 1.2,
      baseSpeedX: (Math.random() - 0.5) * 0.7,
      baseSpeedY: (Math.random() - 0.5) * 0.7,
      alpha: Math.random() * 0.7 + 0.3,
      alphaSpeed: (Math.random() * 0.02) + 0.01
    });
  }

  var pointerPos = { x: -1000, y: -1000 };
  window.addEventListener('pointermove', function(e){ pointerPos.x = e.clientX; pointerPos.y = e.clientY; });

  function spawnWaxExplosion(x, y) {
    for (var k = 0; k < 40; k++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * 8 + 3;
      burstSparks.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 4.5 + 2,
        color: Math.random() > 0.4 ? '#f5cf6d' : '#d82b4f',
        alpha: 1
      });
    }
  }

  function renderFX() {
    ctx.clearRect(0, 0, cW, cH);

    for (var f = 0; f < fireflies.length; f++) {
      var fl = fireflies[f];
      fl.x += fl.baseSpeedX;
      fl.y += fl.baseSpeedY;

      var dx = fl.x - pointerPos.x;
      var dy = fl.y - pointerPos.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 80) {
        var force = (80 - dist) / 80;
        fl.x += (dx / dist) * force * 4;
        fl.y += (dy / dist) * force * 4;
      }

      fl.alpha += fl.alphaSpeed;
      if (fl.alpha > 1 || fl.alpha < 0.2) fl.alphaSpeed = -fl.alphaSpeed;

      if (fl.x < 0) fl.x = cW;
      if (fl.x > cW) fl.x = 0;
      if (fl.y < 0) fl.y = cH;
      if (fl.y > cH) fl.y = 0;

      ctx.save();
      ctx.globalAlpha = fl.alpha;
      ctx.fillStyle = '#fffae0';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#f5cf6d';
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (var b = burstSparks.length - 1; b >= 0; b--) {
      var sp = burstSparks[b];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.alpha -= 0.025;
      if (sp.alpha <= 0) {
        burstSparks.splice(b, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = sp.alpha;
      ctx.fillStyle = sp.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = sp.color;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(renderFX);
  }
  requestAnimationFrame(renderFX);

  // 5. Letter Text & Safe Typewriter with Auto-Scroll
  var fullLetterContent = `জানি অনেক দেরি করে ফেলেছি, আর এই মুহূর্তে তোমার রাগ, বিরক্তি কিংবা অবহেলা—সবকিছুই আমার প্রাপ্য। সেদিন যখন তুমি একটা প্রয়োজনে আমার কথা ভেবে ভরসা করে হাত বাড়িয়েছিলে, আমি সত্যিই চেয়েছিলাম পাশে থাকতে। কিন্তু নিজের পরিস্থিতি এমন এক জায়গায় গিয়ে ঠেকেছিল যে, কাউকে বোঝানোর ভাষা ছিল না।

হয়তো অর্থের অভাবের চেয়েও আমার সাহসের অভাব বেশি ছিল। তোমার মতো একজন মানুষের সামনে নিজের এই ব্যর্থতা আর অপারগতা স্বীকার করতে এতটাই লজ্জা লাগছিল যে, কাপুরুষের মতো চুপ থেকে যোগাযোগটাই এড়িয়ে গেলাম। কিন্তু আজ বুঝতে পারছি, সাহায্য করতে না পারার চেয়ে এই নীরবতা তোমাকে বেশি আঘাত করেছে।

পরিস্থিতি আজও আমার অনুকূলে আসেনি, এখনও তোমাকে কোনো সাপোর্ট করার মতো সামর্থ্য আমার নেই। কিন্তু বুকের ভেতরের এই অপরাধবোধটা আর বয়ে বেড়াতে পারছিলাম না। তোমাকে কষ্ট দেওয়ার কোনো উদ্দেশ্য আমার কোনোদিনই ছিল না। নিজের এই ভুলের জন্য আমি ভেতর থেকে সত্যিই নিঃশর্তভাবে ক্ষমাপ্রার্থী। পারলে আমাকে ক্ষমা করে দিও।`;

  var typingTimer = null;
  var envelopeWrapper = document.getElementById('envelopeWrapper');
  var royalEnvelope = document.getElementById('royalEnvelope');
  var sealMedallion = document.getElementById('sealMedallion');
  var letterDesk = document.getElementById('letterDesk');
  var letterBodyText = document.getElementById('letterBodyText');
  var writingBlinker = document.getElementById('writingBlinker');
  var goldFountainPen = document.getElementById('goldFountainPen');
  var signArea = document.getElementById('signArea');
  var writingContainer = document.getElementById('writingContainer');

  function writeLetter(text) {
    if (typingTimer) clearTimeout(typingTimer);
    letterBodyText.textContent = '';
    writingBlinker.style.display = 'inline-block';
    goldFountainPen.style.display = 'block';
    signArea.classList.remove('visible');
    writingContainer.scrollTop = 0;

    var charIndex = 0;
    var speed = 25;

    function appendChar() {
      if (charIndex < text.length) {
        letterBodyText.textContent += text.charAt(charIndex);
        charIndex++;

        var blinkerLeft = writingBlinker.offsetLeft;
        var blinkerTop = writingBlinker.offsetTop;
        goldFountainPen.style.left = blinkerLeft + 'px';
        goldFountainPen.style.top = blinkerTop + 'px';

        // লেখার সাথে মসৃণ স্ক্রোল
        writingContainer.scrollTop = writingContainer.scrollHeight;

        typingTimer = setTimeout(appendChar, speed + (Math.random() * 15));
      } else {
        writingBlinker.style.display = 'none';
        goldFountainPen.style.display = 'none';
        signArea.classList.add('visible');
        typingTimer = null;
      }
    }
    appendChar();
  }

  var hasUnsealed = false;
  function triggerUnseal() {
    if (hasUnsealed) return;
    hasUnsealed = true;

    initAudio();

    if (navigator.vibrate) {
      try { navigator.vibrate([40, 60, 40]); } catch(e){}
    }

    var rect = sealMedallion.getBoundingClientRect();
    spawnWaxExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
    soundWaxCrack();

    royalEnvelope.classList.add('unsealed');

    setTimeout(function(){
      if (musicOn) startMusic();
    }, 600);

    setTimeout(function(){
      envelopeWrapper.style.transform = 'scale(0.85) translateY(-30px)';
      envelopeWrapper.style.opacity = '0';
    }, 900);

    setTimeout(function(){
      envelopeWrapper.style.display = 'none';
      letterDesk.classList.add('active');
      writeLetter(fullLetterContent);
    }, 1400);
  }

  // খাম বা সিলের যেকোনো জায়গায় স্পর্শ করলেই চিঠি খুলবে
  royalEnvelope.addEventListener('click', triggerUnseal);

})();
</script>
